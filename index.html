<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>治具進度管理系統 V4</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--nav:#0f172a;--nav2:#1e293b;--nav3:#334155;--bg:#f1f5f9;--card:#fff;--line:#e2e8f0;--text:#0f172a;--muted:#64748b;--blue:#2563eb;--blue2:#3b82f6;--red:#dc2626;--green:#16a34a;--amber:#d97706;--radius:10px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI','Microsoft JhengHei',sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
button{cursor:pointer;font:inherit;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}
a{text-decoration:none;color:inherit}
.hidden{display:none!important}
/* Login */
#loginView{min-height:100vh;display:grid;place-items:center;padding:20px}
.login-card{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:32px;box-shadow:0 16px 50px #0f172a20}
html.dark .login-card,html.dark .modal-box,html.dark .card,html.dark .kpi{background:var(--card)}
.login-card h1{font-size:26px;margin-bottom:6px}
.login-card .sub{color:var(--muted);margin-bottom:22px;font-size:14px}
.role-tabs{display:flex;gap:0;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:20px}
.role-tabs button{flex:1;padding:12px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;transition:.15s}
.role-tabs button.active{color:var(--blue);border-bottom-color:var(--blue);background:#eff6ff}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:#475569;margin-bottom:5px;font-weight:500}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:inherit;transition:border .15s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px #2563eb20}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:8px;font-weight:600;font-size:14px;transition:.15s}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:#1d4ed8}
.btn-secondary{background:#fff;border:1px solid #cbd5e1;color:#334155}.btn-secondary:hover{background:#f8fafc}
.btn-danger{background:#fff;border:1px solid #fecaca;color:var(--red)}.btn-danger:hover{background:#fef2f2}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-block{width:100%;justify-content:center}
#loginMsg{color:var(--red);font-size:13px;min-height:20px;margin-top:8px}
/* Layout */
#appView{min-height:100vh}
.shell{display:flex;min-height:100vh}
.sidebar{width:240px;background:var(--nav);color:#cbd5e1;flex:none;padding:16px 10px;position:fixed;inset:0 auto 0 0;overflow-y:auto;z-index:50}
.brand{font-size:17px;font-weight:800;color:#fff;padding:8px 12px 16px;border-bottom:1px solid #ffffff15;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.role-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px}
.role-badge.admin{background:#2563eb;color:#fff}
.role-badge.supplier{background:#d97706;color:#fff}
.nav-title{font-size:10px;color:#94a3b8;padding:12px 10px 4px;text-transform:uppercase;letter-spacing:.5px}
.nav button{width:100%;text-align:left;padding:10px 12px;border-radius:8px;margin:1px 0;color:#cbd5e1;font-weight:500;font-size:14px;transition:.15s;display:flex;align-items:center;gap:8px}
.nav button:hover{background:var(--nav2)}
.nav button.active{background:var(--blue);color:#fff}
.nav-sep{height:1px;background:#ffffff15;margin:10px 6px}
.main{margin-left:240px;width:calc(100% - 240px);padding:20px 28px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.topbar h2{font-size:22px;font-weight:700}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.page{display:none}.page.active{display:block}
/* Cards */
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-top:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.card h3{font-size:16px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:6px}
.empty{color:var(--muted);font-size:13px;padding:16px 0;text-align:center}
/* KPI */
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px}
.kpi.blue::before{background:var(--blue)}.kpi.amber::before{background:var(--amber)}.kpi.green::before{background:var(--green)}.kpi.red::before{background:var(--red)}
.kpi .label{font-size:12px;color:var(--muted);font-weight:500}
.kpi .value{font-size:30px;font-weight:800;margin-top:4px}
.kpi .sub{font-size:11px;color:var(--muted);margin-top:2px}
/* Table */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table.data{width:100%;border-collapse:collapse;min-width:700px}
table.data th,table.data td{padding:9px 12px;border-bottom:1px solid #f1f5f9;text-align:left;font-size:13px;vertical-align:middle}
table.data th{background:#f8fafc;color:#475569;font-weight:600;font-size:12px;white-space:nowrap}
table.data tr:last-child td{border-bottom:0}
table.data tr:hover{background:#f8fafc}
.badge{display:inline-flex;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600}
.badge.green{background:#dcfce7;color:#166534}
.badge.red{background:#fee2e2;color:#b91c1c}
.badge.blue{background:#dbeafe;color:#1d4ed8}
.badge.amber{background:#fef3c7;color:#92400e}
.badge.gray{background:#f1f5f9;color:#64748b}
/* Toolbar */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.toolbar input[type=text],.toolbar input[type=search]{flex:1;min-width:200px;max-width:400px;padding:9px 12px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:inherit}
.toolbar select{padding:9px 12px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:inherit}
html.dark .field input,html.dark .field select,html.dark .field textarea,html.dark .toolbar input,html.dark .toolbar select,html.dark .milestone-row input{background:#101a30;border-color:#33436b;color:var(--text)}
/* Progress */
.pbar{display:flex;align-items:center;gap:6px}
.pbar-track{flex:1;height:7px;background:#e2e8f0;border-radius:4px;overflow:hidden;min-width:60px}
.pbar-fill{height:100%;border-radius:4px;transition:width .3s}
.pbar-val{font-size:12px;font-weight:700;min-width:36px}
/* Gantt */
.gantt{overflow-x:auto}
.gantt-row{margin-bottom:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.gantt-head{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:4px}
.gantt-head .sub{color:var(--muted);font-weight:400;font-size:12px}
.gantt-track{position:relative;height:30px;background:#f1f5f9;border-radius:6px;overflow:hidden;min-width:560px}
.gantt-bar{position:absolute;top:3px;height:24px;border-radius:4px;display:flex;align-items:center;padding:0 6px;font-size:10px;color:#fff;white-space:nowrap;overflow:hidden;transition:opacity .15s}
.gantt-bar:hover{opacity:.8}
.gantt-bar.done{background:var(--green)}
.gantt-bar.overdue{background:var(--red)}
.gantt-bar.pending{background:var(--blue)}
.gantt-bar.doing{background:#60a5fa}
.gantt-bar.hold{background:#94a3b8}
.gantt-bar.active{background:var(--amber)}
.gantt-today{position:absolute;top:0;bottom:0;width:2px;background:#f59e0b;z-index:2}
.gantt-today::after{content:'T';position:absolute;top:-1px;left:-5px;font-size:9px;font-weight:700;color:#f59e0b}
.gantt-legend{display:flex;gap:14px;margin-top:10px;font-size:11px;color:var(--muted)}
.gantt-legend span{display:inline-flex;align-items:center;gap:4px}
.gantt-legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
/* Notification */
.notif{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-bottom:1px solid #f1f5f9}
.notif.unread{background:#eff6ff}
.notif .dot{width:8px;height:8px;border-radius:50%;background:var(--blue);flex:none;margin-top:6px}
.notif .dot.read{background:transparent;border:1.5px solid #cbd5e1}
.notif .txt{flex:1;font-size:13px}
.notif .act{flex:none}
/* Storage */
.storage-bar{height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden;margin:6px 0}
.storage-fill{height:100%;border-radius:4px}
/* Modal */
.modal-bg{position:fixed;inset:0;background:#0f172a70;display:grid;place-items:center;padding:20px;z-index:1000}
.modal-box{width:min(640px,100%);max-height:90vh;overflow-y:auto;background:var(--card);border-radius:14px;padding:24px;box-shadow:0 20px 60px #00000030}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-head h3{font-size:18px;font-weight:700}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.milestone-row{display:flex;gap:6px;align-items:center;margin-bottom:2px}
.milestone-row input,.milestone-row select{padding:7px 9px;border:1px solid #cbd5e1;border-radius:6px}
.milestone-row .ms-name{flex:2}
.milestone-row .ms-date{flex:1.4;font-size:12px}
.milestone-row .ms-status{flex:1.2;font-size:12px}
.milestone-row.ms-over{background:rgba(220,53,69,.07);outline:1px solid rgba(220,53,69,.35);border-radius:6px}
.milestone-row.ms-beyond{background:rgba(245,158,11,.10);outline:2px solid rgba(245,158,11,.65);border-radius:6px}
.ms-notes-wrap{margin:0 0 6px 0;padding:0 4px}
.ms-notes-wrap textarea{width:100%;padding:5px 8px;border:1px solid #cbd5e1;border-radius:6px;font-size:12px;resize:vertical;min-height:30px;color:inherit;background:#fff}
.ms-notes-wrap textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 2px #2563eb20}
html.dark .ms-notes-wrap textarea{background:#101a30;border-color:#33436b;color:var(--text)}
/* Toast */
#toast{position:fixed;bottom:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 18px;border-radius:8px;color:#fff;font-size:14px;font-weight:500;box-shadow:0 4px 12px #00000020;animation:slideIn .3s}
.toast.ok{background:var(--green)}.toast.err{background:var(--red)}.toast.info{background:var(--blue)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
/* Responsive */
@media(max-width:900px){.sidebar{width:200px}.main{margin-left:200px;width:calc(100% - 200px)}.grid4{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
@media(max-width:650px){.sidebar{position:static;width:100%}.shell{display:block}.main{margin:0;width:100%;padding:14px}.grid4{grid-template-columns:1fr}.topbar{flex-direction:column;align-items:flex-start}}
/* Loading overlay */
#loadingOverlay{position:fixed;inset:0;background:#ffffffe0;z-index:9999;display:none;place-items:center;font-size:18px;color:var(--blue)}
.spinner{width:40px;height:40px;border:4px solid #e2e8f0;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin-right:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.conn-indicator{font-size:12px;padding:4px 10px;border-radius:99px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.conn-indicator.online{background:#dcfce7;color:#16a34a}
.conn-indicator.offline{background:#fee2e2;color:#dc2626}
.conn-indicator.syncing{background:#fef3c7;color:#d97706}
.batch-wrap{margin:10px 0;padding:10px;background:#f0f6ff;border:1px solid #bcd4f5;border-radius:8px}
.batch-wrap h4{font-size:13px;margin-bottom:8px;color:#1a5da8}
.batch-table{width:100%;border-collapse:collapse;font-size:12px}
.batch-table th{background:#e8f0fe;padding:6px 8px;text-align:left;font-size:11px;color:#475569}
.batch-table td{padding:4px 6px;border-bottom:1px solid #e2e8f0}
.batch-table input{width:100%;padding:5px 8px;border:1px solid #cbd5e1;border-radius:4px;font-size:12px}
.batch-add-row{font-size:12px;color:var(--blue);cursor:pointer;margin-top:6px;display:inline-block}
/* Sortable & Pager & KPI click */
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--blue)}
.pager{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:10px;font-size:13px;color:var(--muted)}
.kpi.clickable{cursor:pointer;transition:box-shadow .15s,transform .1s}
.kpi.clickable:hover{box-shadow:0 4px 14px #0f172a18;transform:translateY(-1px)}
#reportText{width:100%;font-size:12px;border:1px solid #cbd5e1;border-radius:8px;padding:10px;font-family:Consolas,monospace}
/* Dark Mode */
html.dark{--bg:#0b1220;--card:#151f38;--line:#27365a;--text:#e2e8f0;--muted:#8ea0bd}
html.dark body{background:var(--bg)}
html.dark .login-card{box-shadow:none}
html.dark .field label{color:#a9bad6}
html.dark table.data th{background:#101a30;color:#93a5c4}
html.dark table.data th,html.dark table.data td{border-color:var(--line)}
html.dark table.data tr:hover{background:#1a2745}
html.dark .btn-secondary{background:#101a30;border-color:#33436b;color:#dbe4f3}
html.dark .btn-secondary:hover{background:#1a2745}
html.dark .btn-danger{background:#1a1024;border-color:#7f2d3a}
html.dark .gantt-track{background:#101a30}
html.dark .notif.unread{background:#1a2c50}
html.dark .notif{border-color:var(--line)}
html.dark .role-tabs button{color:var(--muted)}
html.dark .role-tabs button.active{background:#1a2c50}
html.dark .badge.gray{background:#27365a;color:#cbd5e1}
html.dark #reportText{background:#101a30;border-color:#33436b;color:var(--text)}
html.dark #loginMsg,html.dark .empty{color:var(--muted)}
/* Calendar */
.cal-nav{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.cal-nav .cal-title{font-size:18px;font-weight:700;min-width:160px;text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.cal-head{background:#f8fafc;padding:8px;text-align:center;font-size:12px;font-weight:600;color:#475569;border-bottom:1px solid var(--line)}
html.dark .cal-head{background:#101a30;color:#93a5c4}
.cal-cell{min-height:90px;padding:4px 6px;border:1px solid #f1f5f9;font-size:11px;position:relative;vertical-align:top}
html.dark .cal-cell{border-color:var(--line)}
.cal-cell.other{background:#fafbfc;opacity:.5}
html.dark .cal-cell.other{background:#0d1628}
.cal-cell.today{background:#eff6ff;outline:2px solid var(--blue);outline-offset:-2px}
html.dark .cal-cell.today{background:#1a2c50}
.cal-cell .cal-day{font-weight:700;font-size:12px;margin-bottom:2px;color:var(--muted)}
.cal-cell.today .cal-day{color:var(--blue)}
.cal-event{display:block;padding:2px 4px;border-radius:3px;font-size:10px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;color:#fff}
.cal-event.done{background:var(--green)}.cal-event.overdue{background:var(--red)}.cal-event.active{background:var(--blue)}.cal-event.pending{background:#60a5fa}.cal-event.due{background:var(--amber)}
.cal-event:hover{opacity:.8}
.cal-legend{display:flex;gap:14px;margin-top:10px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.cal-legend span{display:inline-flex;align-items:center;gap:4px}
.cal-legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
/* Sub-steps */
.ms-sub-toggle{cursor:pointer;font-size:11px;color:var(--blue);margin-left:4px;user-select:none}
.ms-sub-wrap{margin:0 0 6px 20px;padding:6px 8px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;font-size:12px}
html.dark .ms-sub-wrap{background:#101a30;border-color:#33436b}
.ms-sub-row{display:flex;gap:4px;align-items:center;margin-bottom:3px}
.ms-sub-row input{padding:4px 6px;border:1px solid #cbd5e1;border-radius:4px;font-size:11px}
.ms-sub-row .sub-name{flex:2}
.ms-sub-row .sub-date{flex:1.2;font-size:11px}
.ms-sub-row .sub-status{flex:1;font-size:11px}
.ms-sub-add{font-size:11px;color:var(--blue);cursor:pointer;margin-top:2px}
/* Order form sections */
.order-section{margin:16px 0 10px;padding:10px 12px;border-radius:8px;border:1px solid}
.order-section.customer{background:#f0f6ff;border-color:#bcd4f5}
.order-section.outsource{background:#f0fdf4;border-color:#bbf7d0}
.order-section.supplier-r{background:#fefce8;border-color:#fde68a}
html.dark .order-section.customer{background:#1a2c50;border-color:#274a8a}
html.dark .order-section.outsource{background:#0f2a1a;border-color:#1a5a30}
html.dark .order-section.supplier-r{background:#2a2510;border-color:#5a4a10}
.order-section-title{font-size:13px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.order-section.customer .order-section-title{color:#1a5da8}
.order-section.outsource .order-section-title{color:#166534}
.order-section.supplier-r .order-section-title{color:#92400e}
.order-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.order-fields .field{margin-bottom:0}
.order-fields .field.full{grid-column:1/-1}
@media(max-width:650px){.order-fields{grid-template-columns:1fr}}
.phase-custom-input{margin-top:4px;display:none}
.phase-custom-input.show{display:block}
.ms-progress{width:80px;display:flex;align-items:center;gap:3px}
.ms-progress input{width:42px;padding:4px 5px;font-size:11px;text-align:center;border:1px solid #cbd5e1;border-radius:4px}
.ms-progress .ms-pbar{flex:1;height:6px;background:#e2e8f0;border-radius:3px;overflow:hidden}
.ms-progress .ms-pbar-fill{height:100%;border-radius:3px;transition:width .2s}
.ms-total-progress{margin-top:8px;padding:8px 12px;background:#f0f6ff;border:1px solid #bcd4f5;border-radius:6px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700}
html.dark .ms-total-progress{background:#1a2c50;border-color:#274a8a}
html.dark .ms-progress input{background:#101a30;border-color:#33436b;color:var(--text)}
</style>
</head>
<body>

<!-- Login -->
<section id="loginView">
<div class="login-card">
<div style="display:flex;justify-content:flex-end;gap:6px;margin-bottom:6px">
<button class="btn btn-secondary btn-sm" id="themeBtnLogin" onclick="toggleThemeLogin()">🌙</button>
<button class="btn btn-secondary btn-sm" id="langBtnLogin" onclick="toggleLang()">EN</button>
</div>
<h1 data-i18n="loginTitle">🔧 治具進度管理系統</h1>
<p class="sub" data-i18n="loginSub">V4 專業版 — 供應商治具進度追蹤</p>
<div class="role-tabs">
<button id="tabAdmin" class="active" onclick="setRole('admin')" data-i18n="tabAdmin">🔑 管理員</button>
<button id="tabSupplier" onclick="setRole('supplier')" data-i18n="tabSupplier">🏭 供應商</button>
</div>
<div class="field hidden" id="supCodeWrap"><label data-i18n="supCode">供應商代碼</label><input id="loginCode" data-i18n-ph="supCodePh" placeholder="請輸入您的供應商代碼" onkeydown="if(event.key==='Enter')login()"></div>
<div class="field"><label id="loginLabel" data-i18n="password">密碼</label><input id="loginPwd" type="password" data-i18n-ph="pwdPh" placeholder="輸入任意密碼登入" onkeydown="if(event.key==='Enter')login()"></div>
<div id="supPwdHint" class="hidden" style="font-size:12px;color:var(--muted);margin:-6px 0 10px" data-i18n="supPwdHint"></div>
<button class="btn btn-primary btn-block" onclick="login()" data-i18n="login">登入</button>
<div id="loginMsg"></div>
</div>
</section>

<!-- App -->
<section id="appView" class="hidden">
<div class="shell">
<aside class="sidebar">
<div class="brand"><span data-i18n="brand">🔧 治具進度管理</span><span id="roleBadge" class="role-badge admin">管理員</span></div>
<nav class="nav" id="nav">

function storageInfo(){let bytes=0;for(let k in localStorage)bytes+=(localStorage.getItem(k)||"").length*2;return{used:bytes,pct:Math.round(bytes/(5*1024*1024)*100)}}
function fmt(s,p){return String(s).replace(/\{(\w+)\}/g,(m,k)=>p&&p[k]!=null?p[k]:m)}

/* ==================== 工具函數 ==================== */
function esc(s){if(s==null)return"";return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;")}
function today(){const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function parseDate(v){if(!v)return null;const d=new Date(v);return isNaN(d)?null:d}
function daysBetween(a,b){return Math.round((b-a)/86400000)}
function fmtDate(v){if(!v)return"-";const d=parseDate(v);return d?d.getFullYear()+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+String(d.getDate()).padStart(2,"0"):v}
function fmtDateTime(v){if(!v)return"-";const d=new Date(v);return isNaN(d)?v:d.toLocaleString("zh-TW")}
function toast(msg,type){const el=document.createElement("div");el.className="toast "+(type||"info");el.textContent=msg;document.getElementById("toast").appendChild(el);setTimeout(()=>{el.style.opacity="0";el.style.transition="opacity .3s";setTimeout(()=>el.remove(),300)},2500)}

/* ==================== 業務邏輯 ==================== */
function mStatus(m){if(m.actualDate)return"done";const d=parseDate(m.plannedDate);if(d&&d<today())return"overdue";return"pending"}
function msStatus(m){if(m.actualDate||m.status==="done")return"done";if(m.status==="doing")return"doing";if(m.status==="hold")return"hold";return"todo"}
function msBadge(m){const s=msStatus(m);const map={done:["green","✅ "+t("msDoneC")],doing:["blue","🔄 "+t("msDoing")],hold:["amber","⏸ "+t("msHold")],todo:["gray","⚪ "+t("msTodo")]}[s];let h='<span class="badge '+map[0]+'">'+map[1]+'</span>';if(!m.actualDate){const d=parseDate(m.plannedDate);if(d&&d<today())h+=' <span class="badge red">🔴 '+t("stOverdue")+'</span>'}return h}
function msStatusText(s){return{done:t("msDoneC"),doing:t("msDoing"),hold:t("msHold"),todo:t("msTodo")}[s]||s}
function latestMs(o){const ms=o.milestones||[];if(!ms.length)return"";return ms.find(m=>msStatus(m)!=="done")||ms[ms.length-1]}
function progress(o){if(!o.milestones||!o.milestones.length)return 0;const total=o.milestones.reduce((s,m)=>s+(Number(m.msProgress)||0),0);return Math.round(total/o.milestones.length)}
function orderStatus(o){const ms=o.milestones||[];if(ms.length&&ms.every(m=>mStatus(m)==="done"))return"done";if(ms.some(m=>mStatus(m)==="overdue"))return"overdue";if(progress(o)>0)return"active";return"pending"}
function statusText(s){return{done:t("stDone"),overdue:t("stOverdue"),active:t("stActive"),pending:t("stPending")}[s]||s}

function login(){
  document.getElementById("loginMsg").textContent="";
  if(role==="supplier"){
    const code=document.getElementById("loginCode").value.trim();
    if(!code){document.getElementById("loginMsg").textContent=t("supCodePh");return}
    const s=data.suppliers.find(x=>String(x.loginCode||x.id).toLowerCase()===code.toLowerCase());
    if(!s){document.getElementById("loginMsg").textContent=t("codeNotFound");return}
    if(s.status==="停用"){document.getElementById("loginMsg").textContent=t("supDisabled");return}
    if(document.getElementById("loginPwd").value!==(s.loginPwd||SUPPLIER_PWD)){document.getElementById("loginMsg").textContent=t("pwdWrong");return}

  }
  document.getElementById("loginView").classList.add("hidden");
  document.getElementById("appView").classList.remove("hidden");
  applyPermissions();
  saveAudit("登入",role==="admin"?"admin":supplierName(currentSupplierId));
  checkBackupReminder();
  go("dashboard");
}

function applySort(rows,table){const st=table==="order"?orderSort:supplierSort;if(!st)return rows;const get=o=>table==="order"?{id:o.id,name:o.name,customer:o.customer,project:o.project||"",phase:o.phase||"",supplier:supplierName(o.supplierId),region:o.supplierRegion||"",type:o.type,priority:o.priority||"priMedium",scm:o.scm||"",buyer:o.buyer||"",due:o.dueDate||"",progress:progress(o),status:orderStatus(o)}[st.key]:{id:o.id,name:o.name,contact:o.contact,category:o.category,status:o.status||"正常",code:o.loginCode||""}[st.key];const arr=[...rows];arr.sort((a,b)=>{const x=get(a),y=get(b);if(typeof x==="number"&&typeof y==="number")return(x-y)*st.dir;return String(x||"").localeCompare(String(y||""))*st.dir});return arr}

function renderGantt(){
  const orders=scopeOrders().filter(o=>o.milestones&&o.milestones.length);
  if(!orders.length){document.getElementById("ganttView").innerHTML='<div class="empty">'+t("emptyMs")+'</div>';return}
  let dates=[];
  orders.forEach(o=>o.milestones.forEach(m=>{const d=parseDate(m.plannedDate);if(d)dates.push(d);const a=parseDate(m.actualDate);if(a)dates.push(a)}));
  if(!dates.length){document.getElementById("ganttView").innerHTML='<div class="empty">'+t("emptyDate")+'</div>';return}
  const min=new Date(Math.min.apply(null,dates)-7*86400000);
  const max=new Date(Math.max.apply(null,dates)+7*86400000);
  const total=Math.max(1,daysBetween(min,max));
  const tp=daysBetween(min,today())/total*100;
  let html='<div class="gantt">';
  orders.forEach(o=>{
    html+='<div class="gantt-row"><div class="gantt-head"><span>'+esc(o.id)+" — "+esc(o.name||"")+(o.phase?' <span class="badge blue" style="font-size:10px">'+esc(o.phase)+'</span>':'')+'</span><span class="sub">'+esc(supplierName(o.supplierId))+(o.project?' · '+esc(o.project):'')+(o.quantity?' · '+esc(o.quantity)+t("qtyUnit"):'')+'</span></div><div class="gantt-track">';
    if(tp>=0&&tp<=100)html+='<div class="gantt-today" style="left:'+tp+'%"></div>';
    o.milestones.forEach(m=>{
      const pd=parseDate(m.plannedDate);if(!pd)return;
      const sp=Math.max(0,daysBetween(min,pd)/total*100);
      const st=mStatus(m)==="overdue"?"overdue":msStatus(m);
      let ep;
      if(m.actualDate){const ad=parseDate(m.actualDate);if(ad)ep=daysBetween(min,ad)/total*100;else ep=sp+3}else ep=sp+3;
      const w=Math.max(2.5,ep-sp);
      const ad2=parseDate(m.actualDate);let delayInfo="";if(pd&&ad2){if(ad2>pd)delayInfo="\n🔴 "+fmt(t("msDelayed"),{d:daysBetween(pd,ad2)});else if(ad2<pd)delayInfo="\n🔵 "+fmt(t("msEarly"),{d:daysBetween(ad2,pd)})}const msProgVal=Number(m.msProgress)||0;const title=(m.name||t("msDefault"))+"\n"+msStatusText(msStatus(m))+"\n"+t("msProgressL")+": "+msProgVal+"%\n"+t("gPlanned")+": "+fmtDate(m.plannedDate)+"\n"+t("gActual")+": "+fmtDate(m.actualDate)+delayInfo+(m.notes?"\n📝 "+m.notes:"");
      html+='<div class="gantt-bar '+st+'" style="left:'+sp+'%;width:'+w+'%" title="'+esc(title)+'">'+esc(m.name||"")+'</div>';
    });
    html+="</div></div>";
  });
  html+='</div><div class="gantt-legend"><span><i style="background:var(--green)"></i>'+t("gDone")+'</span><span><i style="background:#60a5fa"></i>'+t("msDoing")+'</span><span><i style="background:var(--blue)"></i>'+t("gPending")+'</span><span><i style="background:#94a3b8"></i>'+t("msHold")+'</span><span><i style="background:var(--red)"></i>'+t("gOverdue")+'</span><span><i style="background:#f59e0b"></i>'+t("gToday")+'</span></div>';
  document.getElementById("ganttView").innerHTML=html;
}

let calYear=0,calMonth=0;
function renderCalendar(){
  const now=new Date();
  if(!calYear){calYear=now.getFullYear();calMonth=now.getMonth()}
  const navEl=document.getElementById("calNav");
  const viewEl=document.getElementById("calView");
  const legEl=document.getElementById("calLegend");
  if(!navEl||!viewEl)return;
  const monthNames=lang==="en"?["January","February","March","April","May","June","July","August","September","October","November","December"]:["一月","二月","三月","四月","五月","六月","七月","八月","九月","十月","十一月","十二月"];
  navEl.innerHTML='<button class="btn btn-secondary btn-sm" onclick="calMonthNav(-1)">◀</button><span class="cal-title">'+monthNames[calMonth]+' '+calYear+'</span><button class="btn btn-secondary btn-sm" onclick="calMonthNav(1)">▶</button><button class="btn btn-secondary btn-sm" onclick="calGoToday()">📅 '+t("calToday")+'</button>';
  const dayLabels=lang==="en"?["Sun","Mon","Tue","Wed","Thu","Fri","Sat"]:["日","一","二","三","四","五","六"];
  let html='<div class="cal-grid">';
  dayLabels.forEach(d=>{html+='<div class="cal-head">'+d+'</div>'});
  const firstDay=new Date(calYear,calMonth,1);
  const lastDay=new Date(calYear,calMonth+1,0);
  const startDow=firstDay.getDay();
  const daysInMonth=lastDay.getDate();
  const prevLast=new Date(calYear,calMonth,0).getDate();
  const todayStr=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");
  /* 收集所有事件 */
  const events=new Map();
  scopeOrders().forEach(o=>{
    const dd=parseDate(o.dueDate);
    if(dd){const key=o.dueDate;if(!events.has(key))events.set(key,[]);events.get(key).push({type:"due",oid:o.id,oname:o.name||"",ms:"📌 "+t("calDue")})}
    (o.milestones||[]).forEach(m=>{
      const pd=parseDate(m.plannedDate),ad=parseDate(m.actualDate);
      if(pd&&m.plannedDate){const key=m.plannedDate;if(!events.has(key))events.set(key,[]);const st=mStatus(m)==="overdue"?"overdue":msStatus(m);events.get(key).push({type:st,oid:o.id,oname:o.name||"",ms:m.name||""})}
    });
  });
  /* 上個月補齊 */
  for(let i=startDow-1;i>=0;i--){const d=prevLast-i;const dateStr=calYear+"-"+String(calMonth).padStart(2,"0")+"-"+String(d).padStart(2,"0");html+='<div class="cal-cell other"><div class="cal-day">'+d+'</div>'+(events.has(dateStr)?renderCalEvents(events.get(dateStr)):"")+'</div>'}
  /* 本月 */
  for(let d=1;d<=daysInMonth;d++){const dateStr=calYear+"-"+String(calMonth+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");const isToday=dateStr===todayStr;html+='<div class="cal-cell'+(isToday?' today':'')+'"><div class="cal-day">'+d+'</div>'+(events.has(dateStr)?renderCalEvents(events.get(dateStr)):"")+'</div>'}
  /* 下個月補齊 */
  const totalCells=startDow+daysInMonth;const remainder=totalCells%7;if(remainder>0){for(let d=1;d<=7-remainder;d++){html+='<div class="cal-cell other"><div class="cal-day">'+d+'</div></div>'}}
  html+='</div>';
  viewEl.innerHTML=html;
  legEl.innerHTML='<span><i style="background:var(--green)"></i>'+t("calDone")+'</span><span><i style="background:var(--red)"></i>'+t("calOverdue")+'</span><span><i style="background:var(--blue)"></i>'+t("calActive")+'</span><span><i style="background:#60a5fa"></i>'+t("msDoing")+'</span><span><i style="background:var(--amber)"></i>'+t("calDue")+'</span><span style="color:var(--muted);font-size:10px;margin-left:8px">💡 '+t("calClickTip")+'</span>';
}
function renderCalEvents(evts){
  if(!evts||!evts.length)return"";
  return evts.slice(0,3).map(e=>'<span class="cal-event '+e.type+'" title="'+esc(e.oid)+' — '+esc(e.ms)+'" onclick="viewOrder(\''+esc(e.oid)+'\')">'+esc(e.ms)+'</span>').join("")+(evts.length>3?'<span style="font-size:9px;color:var(--muted)">+' +(evts.length-3)+'...</span>':"");
}
function calMonthNav(delta){calMonth+=delta;if(calMonth>11){calMonth=0;calYear++}else if(calMonth<0){calMonth=11;calYear--}renderCalendar()}

function renderPerf(){
  if(!data.suppliers.length){document.getElementById("perfView").innerHTML='<div class="empty">'+t("emptySup")+'</div>';return}
  const sups=role==="supplier"?data.suppliers.filter(s=>s.id===currentSupplierId):data.suppliers;
  const rows=sups.map(s=>{
    const os=data.orders.filter(o=>o.supplierId===s.id||o.supplier===s.name);
    const done=os.filter(o=>orderStatus(o)==="done").length;
    const late=os.filter(o=>orderStatus(o)==="overdue").length;
    const active=os.filter(o=>orderStatus(o)==="active").length;
    const rate=os.length?Math.round(done/os.length*100):0;
    /* #9: 延遲趨勢計算 */
    let trend=0;const sorted=[...os].sort((a,b)=>(a.orderDate||"").localeCompare(b.orderDate||""));
    for(let i=sorted.length-1;i>=0;i--){const o=sorted[i];const hasDelay=(o.milestones||[]).some(m=>{const pd=parseDate(m.plannedDate),ad=parseDate(m.actualDate);return pd&&ad&&ad>pd});if(hasDelay)trend++;else break}
    return{s,os:os.length,done,late,active,rate,trend};
  });
  rows.sort((a,b)=>b.rate-a.rate);
  document.getElementById("perfView").innerHTML='<div class="table-wrap"><table class="data"><tr><th>'+t("thSupplier")+'</th><th>'+t("thOrders")+'</th><th>'+t("stActive")+'</th><th>'+t("thDone")+'</th><th>'+t("stOverdue")+'</th><th>'+t("thRate")+'</th><th>'+t("thPerf")+'</th><th>'+t("thTrend")+'</th></tr>'+rows.map(r=>{

    const trendBadge=r.trend>=3?'<span style="color:var(--red);font-weight:700;font-size:12px">'+fmt(t("warnTrend"),{n:r.trend})+'</span>':r.trend>=1?'<span style="color:var(--amber);font-size:12px">⚠️ '+r.trend+'</span>':'<span style="color:var(--green);font-size:12px">✅</span>';
    return'<tr><td><b>'+esc(r.s.name)+'</b></td><td>'+r.os+'</td><td>'+r.active+'</td><td>'+r.done+'</td><td>'+(r.late?'<span style="color:var(--red);font-weight:700">'+r.late+'</span>':r.late)+'</td><td><div class="pbar"><span class="pbar-val">'+r.rate+'%</span><div class="pbar-track"><div class="pbar-fill" style="width:'+r.rate+'%;background:'+barColor+'"></div></div></div></td><td>'+(r.rate>=80?t("perfGreat"):r.rate>=50?t("perfOk"):r.rate>0?t("perfWatch"):t("perfStop"))+'</td><td>'+trendBadge+'</td></tr>';
  }).join("")+'</table></div>';
}

function mergeImport(newSup,newOrd){

  newSup.forEach(s=>{if(s.id)sm.set(s.id,Object.assign({},sm.get(s.id),s))});

  const om=new Map(data.orders.map(o=>[o.id,o]));

        save();saveAudit("JSON 還原 ("+mode+")",f.name);renderAll();toast(fmt(t("importOk"),{s:data.suppliers.length,o:data.orders.length}),"ok");
      }catch(e){toast("JSON 格式錯誤","err")}
    };
    r.readAsText(f);
  };
  inp.click();
}

function validateData(){

function batchUpdate(){
  const os=scopeOrders().filter(o=>orderStatus(o)!=="done");
  if(!os.length){toast(t("emptyOrd"),"info");return}
  const allMsNames=[...new Set(os.flatMap(o=>(o.milestones||[]).filter(m=>!m.actualDate).map(m=>m.name)))];
  document.getElementById("modalSave").style.display="";
  document.getElementById("modalTitle").textContent=t("batchTitle");
  let html='<div style="margin-bottom:10px;padding:8px;background:#f0f6ff;border:1px solid #bcd4f5;border-radius:6px;font-size:13px;color:#1a5da8">'+t("batchHint")+'</div>';
  html+='<div style="margin-bottom:10px"><label><input type="checkbox" id="batchAll" onchange="document.querySelectorAll(\'.batch-chk\').forEach(c=>c.checked=this.checked)"> '+t("batchSelectAll")+'</label></div>';
  html+='<div class="table-wrap"><table class="data"><tr><th></th><th>'+t("thOrder")+'</th><th>'+t("thName")+'</th><th>'+t("thLatest")+'</th></tr>';
  html+=os.map(o=>{const lm=latestMs(o);return'<tr><td><input type="checkbox" class="batch-chk" value="'+esc(o.id)+'"></td><td><b>'+esc(o.id)+'</b></td><td>'+esc(o.name)+'</td><td>'+(lm?esc(lm.name)+" "+msBadge(lm):"-")+'</td></tr>'}).join("");
  html+='</table></div>';
  html+='<div style="margin-top:12px"><label><b>'+t("batchMs")+'</b></label><select id="batchMsSel" style="width:100%;padding:8px;margin-top:4px;border:1px solid #cbd5e1;border-radius:6px">'+allMsNames.map(n=>'<option value="'+esc(n)+'">'+esc(n)+'</option>').join("")+'</select></div>';
  html+='<div style="margin-top:8px"><label><b>'+t("batchDate")+'</b></label><input id="batchDateVal" type="date" style="width:100%;padding:8px;margin-top:4px;border:1px solid #cbd5e1;border-radius:6px"></div>';
  html+='<div style="margin-top:8px"><label><b>'+t("batchStatus")+'</b></label><select id="batchStatusVal" style="width:100%;padding:8px;margin-top:4px;border:1px solid #cbd5e1;border-radius:6px"><option value="done">'+t("msDoneC")+'</option><option value="doing">'+t("msDoing")+'</option><option value="hold">'+t("msHold")+'</option></select></div>';
  html+='<div style="margin-top:8px"><label><b>'+t("msNotes")+'</b></label><textarea id="batchNotesVal" style="width:100%;padding:8px;margin-top:4px;border:1px solid #cbd5e1;border-radius:6px;min-height:50px" placeholder="'+t("msNotesPh")+'"></textarea></div>';
  document.getElementById("modalBody").innerHTML=html;
  document.getElementById("modalSave").onclick=applyBatchUpdate;
  document.getElementById("modal").classList.remove("hidden");
}
function applyBatchUpdate(){
  const ids=[...document.querySelectorAll(".batch-chk:checked")].map(c=>c.value);
  if(!ids.length){toast(t("emptyOrd"),"err");return}
  const msName=document.getElementById("batchMsSel").value;
  const dateVal=document.getElementById("batchDateVal").value;
  const statusVal=document.getElementById("batchStatusVal").value;
  const notesVal=document.getElementById("batchNotesVal").value.trim();
  let cnt=0;
  ids.forEach(id=>{const o=data.orders.find(x=>x.id===id);if(!o)return;(o.milestones||[]).forEach(m=>{if(m.name===msName&&!m.actualDate){if(dateVal)m.actualDate=dateVal;m.status=statusVal;if(notesVal)m.notes=notesVal;cnt++}})});
  save();saveAudit("批次更新",ids.length+" 筆");closeModal();renderAll();toast(fmt(t("batchDone"),{n:cnt}),"ok");
}
function toggleNeedHelp(id){
  const o=data.orders.find(x=>x.id===id);if(!o)return;
  o.needHelp=!o.needHelp;
  save();saveAudit(o.needHelp?"標記需要協助":"取消協助",id);
  if(o.needHelp)toast(t("helpNotify"),"info");
  renderAll();
}
